# pnpm settings for episteme-core (single-package workspace).
# pnpm 10 reads overrides from here — the package.json "pnpm" field is deprecated.
#
# Security overrides: force patched versions of vulnerable transitive deps.
# Keep ranges scoped (name@range) so unaffected majors resolve naturally.
overrides:
  rollup: '>=4.59.0'
  picomatch: '>=4.0.4'
  path-to-regexp: '>=8.4.0'
  brace-expansion: '>=1.1.13'
  '@modelcontextprotocol/sdk': '>=1.25.2'
  'ws@>=8.0.0 <8.20.1': '>=8.20.1'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'hono@<4.12.21': '>=4.12.21'
  'shell-quote@>=1.1.0 <=1.8.3': '>=1.8.4'
  'esbuild@>=0.17.0 <0.28.1': '>=0.28.1'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  # js-yaml advisories affect <3.13.1. Stay INSIDE v3 — v4+ removed safeLoad,
  # which gray-matter (Mastra transitive dep) calls at server startup.
  'js-yaml@<3.14.1': '>=3.14.1 <4'
